name: Validar PR (origen y nombre de rama)

# Rechaza (cierra) automáticamente los PRs que no sirven para el modelo del curso, por dos
# motivos: que vengan de un FORK, o que la rama NO siga la convención.
# Por qué cerrar y no solo bloquear: el PR del estudiante vive TODO el cuatrimestre (modelo
# de PR vivo). Si arranca mal, el problema persiste hasta el final; es más simple cerrarlo al
# abrirlo para que lo rehaga bien desde el día 1.
#
# Caso FORK (visto el 2026-10-08, PR #199): quien no acepta la invitación al repo no tiene
# push, así que GitHub le ofrece forkear y abrir el PR desde su copia. El trabajo puede estar
# perfecto, pero sus entregas quedan en el fork: no estan en este repo, el docente no las ve
# donde las busca y el reporte de entregas (que lee `git ls-tree origin/<rama>`) no las cuenta.
# El mensaje lo manda a aceptar la invitación y a resubir la rama acá, y menciona al docente
# para que le llegue la notificación (el estudiante puede estar trabado esperando la invitación).
#
# Los dos chequeos van en el MISMO job y en orden: si el PR viene de un fork, el step del
# origen cierra y sale con exit 1, así que el del nombre de rama no corre y el estudiante
# recibe un solo comentario.
#
# Convención de ramas válidas para PRs hacia main:
#   - estudiante/apellido-nombre   (entrega individual del estudiante)
#   - tpfinal/G<NN>               (TP Final grupal, ej: tpfinal/G01)
#
# Regla de nombres compuestos: van PEGADOS, sin guion ni espacio.
#   Maria Jose Garcia Lopez -> estudiante/garcialopez-mariajose
# Asi el guion es SIEMPRE el separador apellido-nombre: la rama lleva
# exactamente uno y no hay ambiguedad sobre donde termina el apellido.
# El docente (juansokil) queda exento (sus releases no se autocierran).
#
# Seguridad: usamos pull_request_target SOLO para leer el nombre de la rama y el repo de
# origen, y para comentar/cerrar con GITHUB_TOKEN. NO hacemos checkout del código del PR, así
# que es seguro aunque el PR venga de un fork (que es justo uno de los casos que detecta).
#
# NOTA: para que corra, este workflow tiene que estar en la rama default (main) cuando
# arranque el cuatrimestre (incluilo en el reset de main de 2026-2C).

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  validar-rama:
    runs-on: ubuntu-latest
    steps:
      - name: Validar que el PR venga de una rama de este repo (no de un fork)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BR: ${{ github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          DOCENTE: juansokil
        run: |
          set -euo pipefail
          echo "PR #$PR — origen: '${HEAD_REPO:-(sin repo)}' — base: '$REPO' — autor: $AUTHOR"

          # El docente no se autovalida.
          if [ "$AUTHOR" = "$DOCENTE" ]; then
            echo "Autor docente ($AUTHOR): sin validar."
            exit 0
          fi

          # head.repo vacio = el fork fue borrado. El PR ya esta roto y no hay nada que
          # explicarle al estudiante: no comento para no generar un falso positivo.
          if [ -z "${HEAD_REPO:-}" ]; then
            echo "No pude determinar el repo de origen: no valido."
            exit 0
          fi

          if [ "$HEAD_REPO" = "$REPO" ]; then
            echo "Origen OK: la rama esta en este repo."
            exit 0
          fi

          echo "PR desde un fork ($HEAD_REPO) — comento y cierro."
          MENSAJE=$(cat <<EOF
          Hola 👋 — **cerré este PR automáticamente** porque viene de un **fork** (\`$HEAD_REPO\`) y no de una rama de este repositorio. Tu trabajo puede estar perfecto: lo único que hay que cambiar es **de dónde sale el PR**.

          Esto suele pasar cuando todavía no aceptaste la invitación al repo: sin eso Git no te deja subir una rama acá, y GitHub te ofrece el camino del fork.

          En el curso trabajamos distinto: **una rama tuya dentro de este repo, y un solo PR abierto todo el cuatrimestre**, donde se van sumando las entregas de cada clase. Desde un fork ese modelo no funciona: tus entregas quedan en tu copia y no aparecen donde se buscan para corregir.

          **Cómo arreglarlo** (el trabajo ya está hecho, es solo mudarlo de lugar):

          **1.** Aceptá la invitación al repo: https://github.com/$REPO/invitations — si ya venció, avisá en este mismo PR y te la mando de nuevo.

          **2.** En tu clon, apuntá \`origin\` a este repo y subí tu rama:

          \`\`\`bash
          git remote -v     # si apunta a tu fork, corré lo que sigue
          git remote set-url origin https://github.com/$REPO.git
          git push -u origin $BR
          \`\`\`

          **3.** Abrí un **PR nuevo** desde \`$BR\` hacia \`main\` y **dejalo abierto**: ese va a ser tu PR para todas las entregas del cuatrimestre.

          Cualquier duda con Git, mirá \`TpFinal/git-guia.md\` o escribime.

          @$DOCENTE te etiqueto para que lo tengas en el radar: este PR quedó cerrado y el estudiante necesita la invitación aceptada para rehacerlo.
          EOF
          )
          # el heredoc va indentado para no romper el YAML: se le saca la sangria
          printf '%s\n' "$MENSAJE" | sed 's/^          //' > /tmp/mensaje-fork.md
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/mensaje-fork.md
          gh pr close "$PR" --repo "$REPO"
          echo "::error::PR #$PR viene del fork $HEAD_REPO. Cerrado: la rama tiene que estar en $REPO."
          exit 1

      - name: Validar nombre de rama y cerrar si no corresponde
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BR: ${{ github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
          DOCENTE: juansokil
          MENSAJE: |
            Hola 👋 — **cerré este PR automáticamente** porque el nombre de tu rama no sigue la convención del curso.

            Tu rama tiene que llamarse **`estudiante/apellido-nombre`**, en minúsculas y **con un solo guion**. Como tu PR queda **abierto todo el cuatrimestre** (una sola rama, un solo PR para todas las entregas), conviene arrancar bien desde el principio.

            **Si tenés más de un nombre o más de un apellido, van pegados** (sin espacio ni guion):

            | Estudiante | Rama |
            | :--- | :--- |
            | Juan Sokil | `estudiante/sokil-juan` |
            | Juan Pablo Sokil | `estudiante/sokil-juanpablo` |
            | María José García López | `estudiante/garcialopez-mariajose` |
            | Tomás Del Río | `estudiante/delrio-tomas` |

            Sin tildes ni eñes (José → `jose`, Núñez → `nunez`). El guion se usa **solo** para separar el apellido del nombre: por eso la rama lleva exactamente uno.

            **Cómo arreglarlo** (renombrar tu rama y volver a abrir el PR):

            ```bash
            # 1. Renombrá tu rama local
            git branch -m estudiante/apellido-nombre

            # 2. Subila con el nombre correcto
            git push -u origin estudiante/apellido-nombre

            # 3. (opcional) Borrá la rama vieja del remoto
            git push origin --delete <rama-vieja>
            ```

            Después abrí un **PR nuevo** desde `estudiante/apellido-nombre` hacia `main` y dejalo **abierto**: ese va a ser tu PR para todas las entregas del cuatrimestre.

            > **Grupos del TP Final**: la rama va `tpfinal/G<NN>` (ej: `tpfinal/G01`).

            Cualquier duda con Git, mirá `TpFinal/git-guia.md` o escribime.
        run: |
          set -euo pipefail
          echo "PR #$PR — rama: '$BR' — autor: $AUTHOR"

          # Bypass: el docente no se autovalida (sus releases pueden tener otros nombres)
          if [ "$AUTHOR" = "$DOCENTE" ]; then
            echo "Autor docente ($AUTHOR): sin validar."
            exit 0
          fi

          # Patrones permitidos.
          # estudiante/<apellido>-<nombre>: EXACTAMENTE un guion. Los nombres y
          # apellidos compuestos van pegados (garcialopez-mariajose), asi el guion
          # separa siempre apellido de nombre y la rama nunca es ambigua.
          if printf '%s' "$BR" | grep -Eq '^estudiante/[a-z0-9]+-[a-z0-9]+$'; then
            echo "Rama OK: $BR"
            # El PR del estudiante vive TODO el cuatrimestre, y GitHub lo titula
            # con el mensaje del primer commit ("clase01 (Registro)") cuando
            # la rama tiene uno solo -- que en clase 01 es siempre. Los commits
            # nuevos no cambian el titulo, asi que se pone el nombre de la rama.
            gh pr edit "$PR" --repo "$REPO" --title "$BR"
            exit 0
          fi

          # tpfinal/G<NN>: el titulo NO se toca, la consigna del TP pide uno
          # propio ("TP Final - G<NN> - <API>").
          if printf '%s' "$BR" | grep -Eq '^tpfinal/G[0-9]{2}$'; then
            echo "Rama OK: $BR"
            exit 0
          fi

          echo "Rama inválida: $BR — comento y cierro el PR."
          gh pr comment "$PR" --repo "$REPO" --body "$MENSAJE"
          gh pr close "$PR" --repo "$REPO"
          echo "::error::Rama '$BR' no sigue la convención (estudiante/apellido-nombre o tpfinal/G<NN>). PR cerrado."
          exit 1
