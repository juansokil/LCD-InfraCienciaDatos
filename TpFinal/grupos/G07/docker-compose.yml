
services:
  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    image: apache/airflow:3.1.5

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    depends_on:
      postgres:
        condition: service_healthy

    command: db migrate
    restart: "no"

  airflow-apiserver:
    image: apache/airflow:3.1.5

    command: api-server

    ports:
      - "8081:8080"

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/airflow_passwords.json      
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET}
    
    volumes:
      - ./airflow_passwords.json:/opt/airflow/airflow_passwords.json

    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    image: apache/airflow:3.1.5

    command: scheduler

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/      
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET} 
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET}
      USGS_DB_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"


    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts:ro
      - ./sql:/opt/airflow/sql:ro

    depends_on:
      airflow-init:
        condition: service_completed_successfully
      bronze-init:
        condition: service_completed_successfully
      silver-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    image: apache/airflow:3.1.5

    command: dag-processor

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"      
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

    volumes:
      - ./dags:/opt/airflow/dags

    depends_on:
      airflow-init:
        condition: service_completed_successfully

  bronze-init:
    image: postgres:16

    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./sql:/sql:ro

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - psql
      - -h
      - postgres
      - -U
      - ${POSTGRES_USER}
      - -d
      - ${POSTGRES_DB}
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /sql/01_create_bronze.sql

    restart: "no"

  silver-init:
    image: postgres:16

    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./sql:/sql:ro

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - psql
      - -h
      - postgres
      - -U
      - ${POSTGRES_USER}
      - -d
      - ${POSTGRES_DB}
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /sql/02_create_silver.sql

    restart: "no"

volumes:
  postgres_data:
