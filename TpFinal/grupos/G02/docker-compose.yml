name: open_meteo_tp

services:
  airflow_db:
    image: postgres:17-alpine
    container_name: open_meteo_airflow_db
    env_file: .env
    environment:
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - open_meteo_network

  warehouse:
    image: postgres:17-alpine
    container_name: open_meteo_warehouse
    env_file: .env
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB_NAME}
      POSTGRES_USER: ${WAREHOUSE_DB_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_DB_USER} -d ${WAREHOUSE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - open_meteo_network

  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: open_meteo_airflow
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow_db:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "10"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/airflow_passwords.json
      AIRFLOW_CONN_WAREHOUSE: postgresql://${WAREHOUSE_DB_USER}:${WAREHOUSE_DB_PASSWORD}@warehouse:5432/${WAREHOUSE_DB_NAME}
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: ${WAREHOUSE_DB_NAME}
      WAREHOUSE_USER: ${WAREHOUSE_DB_USER}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
    command: standalone
    depends_on:
      airflow_db:
        condition: service_healthy
      warehouse:
        condition: service_healthy
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
      - ./airflow_passwords.json:/opt/airflow/airflow_passwords.json
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - open_meteo_network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: open_meteo_dashboard
    env_file: .env
    environment:
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: ${WAREHOUSE_DB_NAME}
      WAREHOUSE_USER: ${WAREHOUSE_DB_USER}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
    depends_on:
      warehouse:
        condition: service_healthy
    ports:
      - "8501:8501"
    restart: unless-stopped
    networks:
      - open_meteo_network

volumes:
  airflow_db_data:
  warehouse_data:
  airflow_logs:

networks:
  open_meteo_network:
    driver: bridge