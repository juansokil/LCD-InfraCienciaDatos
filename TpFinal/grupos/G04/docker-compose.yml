# Configuración compartida de los contenedores Airflow
x-airflow-common: &airflow-common
  build:
    context: .
    target: airflow
  image: g04-airflow:3.1.5

  env_file:
    - .env

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_db:5432/airflow

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: g04-clase-jwt-secret-no-produccion

    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/project/.airflow_auth.json

    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PYTHONPATH: /opt/airflow/project/dags
    PROJECT_ROOT: /opt/airflow/project

  volumes:
    - ./:/opt/airflow/project
    - airflow_logs:/opt/airflow/logs

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    airflow_db:
      condition: service_healthy
    data_warehouse:
      condition: service_healthy


services:

  # Base de datos de los datos climáticos
  data_warehouse:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${PG_PORT_HOST}:5432"

    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./sql/init_schemas.sql:/docker-entrypoint-initdb.d/01-init_schemas.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  # Base de datos interna de Airflow
  airflow_db:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow

    volumes:
      - airflow_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  # Inicializa la base de metadatos de Airflow
  airflow-init:
    <<: *airflow-common

    entrypoint: /bin/bash
    command:
      - -ec
      - |
        if [ ! -f /opt/airflow/project/.airflow_auth.json ]; then
          printf '{"%s":"%s"}\n' "$${AIRFLOW_USERNAME}" "$${AIRFLOW_PASSWORD}" > /opt/airflow/project/.airflow_auth.json
        fi
        airflow db migrate

    restart: "no"


  # Interfaz web y API de Airflow
  airflow-api-server:
    <<: *airflow-common

    command: api-server

    ports:
      - "8080:8080"

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

    restart: unless-stopped


  # Programador de tareas
  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 30s

    restart: unless-stopped


  # Procesador de archivos DAG
  airflow-dag-processor:
    <<: *airflow-common

    command: dag-processor

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 30s

    restart: unless-stopped


  # Ejecutor de tareas diferidas
  airflow-triggerer:
    <<: *airflow-common

    command: triggerer

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    restart: unless-stopped


  # Bootstrap del integrante de integración
  airflow-bootstrap:
    <<: *airflow-common

    entrypoint:
      - /bin/bash
      - /opt/airflow/project/scripts/bootstrap.sh

    depends_on:
      airflow-api-server:
        condition: service_healthy
      airflow-scheduler:
        condition: service_healthy
      airflow-dag-processor:
        condition: service_healthy

    restart: "no"


  # Dashboard de Streamlit
  dashboard:
    build:
      context: .
      target: dashboard

    image: g04-dashboard:local

    env_file:
      - .env

    environment:
      PYTHONPATH: /opt/airflow/project/dags

    working_dir: /opt/airflow/project

    command:
      - streamlit
      - run
      - dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true

    ports:
      - "8501:8501"

    volumes:
      - ./:/opt/airflow/project

    depends_on:
      data_warehouse:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped


# Almacenamiento persistente
volumes:
  warehouse_data:
  airflow_db_data:
  airflow_logs: